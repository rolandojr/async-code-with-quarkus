quarkus:
  # Desactivar DevServices
  kafka:
    devservices:
      enabled: false
  apicurio-registry:
    devservices:
      enabled: false
  datasource:
    devservices:
      enabled: false

    # Configuración de Base de Datos
    db-kind: postgresql
    username: postgres
    password: postgres
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/example_db
      max-size: 10
      acquisition-timeout: PT10S
      idle-timeout: PT10M

  # Hibernate ORM
  hibernate-orm:
    database:
      generation: update
  log:
    console:
      format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) [%X{traceId}] %s%e%n"
#    file:
#      enabled: true
#      path: 'D:/developer/docker/elk/logs/quarkus-app.log'
#      level: INFO
#      format: JSON


# Configuración de Mensajería (SmallRye Reactive Messaging)
mp:
  messaging:
    incoming:
      words-in:
        connector: smallrye-kafka
        topic: words
        bootstrap:
          servers: localhost:9092
        group:
          id: async-group-test-1
        auto:
          offset:
            reset: earliest

        # --- CAMBIOS PARA SCHEMA REGISTRY ---
        # Usamos Avro para el valor (Value)
        value:
          deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
          # URL del Schema Registry
        schema:
          registry:
            url: http://localhost:8081
          # Indica que queremos que convierta el Avro a un objeto específico (POJO generado)
        specific:
          avro:
            reader: true
          # ------------------------------------

        # Estrategia de fallo y DLQ
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: my-dead-letter-topic
          key:
            serializer: org.apache.kafka.common.serialization.StringSerializer
          value:
            serializer: io.confluent.kafka.serializers.KafkaAvroSerializer