quarkus:
  # Desactivar DevServices
  kafka:
    devservices:
      enabled: false
  datasource:
    devservices:
      enabled: false

    # Configuración de Base de Datos
    db-kind: postgresql
    username: postgres
    password: postgres
    reactive:
      url: vertx-reactive:postgresql://localhost:5432/example_db
      max-size: 10
      acquisition-timeout: PT10S
      idle-timeout: PT10M

  # Hibernate ORM
  hibernate-orm:
    database:
      generation: update

# Configuración de Mensajería (SmallRye Reactive Messaging)
mp:
  messaging:
    incoming:
      words-in:
        connector: smallrye-kafka
        topic: words
        bootstrap:
          servers: localhost:9092
        group:
          id: async-group-test-1
        auto:
          offset:
            reset: earliest

        # Estrategia de fallo y DLQ
        failure-strategy: dead-letter-queue
        dead-letter-queue:
          topic: my-dead-letter-topic
          key:
            serializer: org.apache.kafka.common.serialization.StringSerializer
          value:
            serializer: org.apache.kafka.common.serialization.StringSerializer